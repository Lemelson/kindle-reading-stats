<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <defs>
    <style>
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .sub { font: 400 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
      .h { font: 700 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .ui { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #181818; }
      .ui-inv { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .ui-sm { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4a4a4a; }
      .mono-sm { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #181818; }
      .code { font: 400 12.2px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; }
      .ck { font: 600 12.2px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #79c0ff; }
      .cs { font: 400 12.2px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a5d6ff; }
      .cn { font: 600 12.2px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7ee787; }
      .cd { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    </style>
  </defs>

  <rect width="1000" height="540" rx="14" fill="#ffffff"/>
  <rect x="1" y="1" width="998" height="538" rx="13" fill="none" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="34" y="42" class="title">KUAL E-Ink Menu &amp; JSONL Output Preview</text>
  <text x="34" y="64" class="sub">Control collection directly from KUAL with eips on-screen status and inspect structured JSONL events offline.</text>

  <!-- Left: Kindle E-Ink Device showing KUAL Menu -->
  <rect x="34" y="88" width="386" height="422" rx="20" fill="#2c2f36" stroke="#181a1f" stroke-width="2"/>
  <rect x="52" y="106" width="350" height="386" rx="6" fill="#f4f2ec" stroke="#141414" stroke-width="1.5"/>

  <!-- E-Ink KUAL Header -->
  <rect x="52" y="106" width="350" height="34" rx="5" fill="#1b1b1b"/>
  <text x="68" y="128" class="ui-inv">KUAL  ›  Reading Stats</text>
  <text x="344" y="128" class="ui-inv" style="font-weight:400;font-size:11px">84% 19:42</text>

  <!-- KUAL Menu Items -->
  <rect x="70" y="158" width="314" height="38" rx="4" fill="#1b1b1b"/>
  <text x="86" y="182" class="ui-inv">▶  Start Logger</text>

  <rect x="70" y="206" width="314" height="38" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
  <text x="86" y="230" class="ui">■  Stop Logger</text>

  <rect x="70" y="254" width="314" height="38" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
  <text x="86" y="278" class="ui">●  Logger Status</text>

  <rect x="70" y="302" width="314" height="38" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
  <text x="86" y="326" class="ui">↓  Export Snapshot Now</text>

  <rect x="70" y="350" width="314" height="38" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
  <text x="86" y="374" class="ui">≡  Show Today Summary</text>

  <!-- eips bottom status strip -->
  <line x1="64" y1="414" x2="390" y2="414" stroke="#bdb9b0" stroke-width="1"/>
  <text x="68" y="434" class="ui-sm">eips status output:</text>
  <rect x="66" y="442" width="322" height="36" rx="4" fill="#e8e5dc" stroke="#1b1b1b" stroke-width="1"/>
  <text x="76" y="464" class="mono-sm">RUNNING pid=2841 | events=412 | today=68p</text>

  <!-- Right: JSONL Output & jq Analytics Preview -->
  <rect x="444" y="88" width="522" height="422" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <!-- Window bar -->
  <rect x="444" y="88" width="522" height="36" rx="14" fill="#161b22"/>
  <rect x="444" y="110" width="522" height="14" fill="#161b22"/>
  <circle cx="466" cy="106" r="5" fill="#ff5f56"/>
  <circle cx="484" cy="106" r="5" fill="#ffbd2e"/>
  <circle cx="502" cy="106" r="5" fill="#27c93f"/>
  <text x="526" y="110" class="cd">events-2026-11.jsonl — append-only reading log</text>

  <!-- JSONL lines -->
  <text x="464" y="152" class="cd"># 1. Book opened</text>
  <text x="464" y="172" class="code">{<tspan class="ck">"captured_at"</tspan>:<tspan class="cs">"2026-11-22T20:14:03Z"</tspan>,</text>
  <text x="476" y="190" class="code"><tspan class="ck">"source"</tspan>:<tspan class="cs">"/var/log/metrics_generic"</tspan>,</text>
  <text x="476" y="208" class="code"><tspan class="ck">"schema"</tspan>:<tspan class="cn">"ereader.open_book"</tspan>}</text>

  <text x="464" y="242" class="cd"># 2. Page turn recorded</text>
  <text x="464" y="262" class="code">{<tspan class="ck">"captured_at"</tspan>:<tspan class="cs">"2026-11-22T20:14:49Z"</tspan>,</text>
  <text x="476" y="280" class="code"><tspan class="ck">"source"</tspan>:<tspan class="cs">"/var/log/metrics_generic"</tspan>,</text>
  <text x="476" y="298" class="code"><tspan class="ck">"schema"</tspan>:<tspan class="cn">"ereader.book_page_turn"</tspan>,</text>
  <text x="476" y="316" class="code"><tspan class="ck">"start_position"</tspan>:<tspan class="cn">1024</tspan>, <tspan class="ck">"end_position"</tspan>:<tspan class="cn">1088</tspan>}</text>

  <text x="464" y="350" class="cd"># 3. Active reading duration</text>
  <text x="464" y="370" class="code">{<tspan class="ck">"captured_at"</tspan>:<tspan class="cs">"2026-11-22T20:42:18Z"</tspan>,</text>
  <text x="476" y="388" class="code"><tspan class="ck">"source"</tspan>:<tspan class="cs">"/var/log/cvm"</tspan>,</text>
  <text x="476" y="406" class="code"><tspan class="ck">"schema"</tspan>:<tspan class="cn">"reader.activeDuration"</tspan>}</text>

  <!-- Quick jq query box -->
  <rect x="464" y="428" width="482" height="62" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="478" y="450" class="cn" style="font-size:11.5px">$ jq -s 'group_by(.schema) | map({(.[0].schema):length})'</text>
  <text x="478" y="472" class="cd" style="font-size:11.2px">→ [{"ereader.book_page_turn":348}, {"reader.activeDuration":41}]</text>
</svg>
